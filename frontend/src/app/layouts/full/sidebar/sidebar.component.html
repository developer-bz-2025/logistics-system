<!-- BZ design: white sidebar with grouped links, user chip and logout -->
<div class="bz-sidenav" *ngIf="theme.isBz">
  <a class="bz-sidenav__brand" routerLink="/">
    <img [src]="theme.logos.header" alt="Basmeh & Zeitooneh" />
  </a>

  <nav class="bz-sidenav__nav" aria-label="Main navigation">
    <app-nav-item *ngFor="let item of navItems" [item]="item" variant="bz"></app-nav-item>
    <div *ngIf="isLoadingCategories" class="bz-sidenav__loading">Loading categories…</div>
  </nav>

  <div class="bz-sidenav__footer">
    <!-- Opens the profile popup: email, role, locations, change password, logout -->
    <app-bz-user-menu *ngIf="user?.name" [user]="user" yPosition="above"></app-bz-user-menu>
    <a class="bz-btn-logout" [routerLink]="['/authentication/login']">
      <i-tabler name="logout" class="icon-18 d-flex"></i-tabler>
      Logout
    </a>
  </div>
</div>

<!-- Classic design -->
<div class="flex-layout" *ngIf="!theme.isBz">
  <app-branding></app-branding>
  <mat-nav-list class="sidebar-list">
    <app-nav-item *ngFor="let item of navItems" [item]="item"> </app-nav-item>

    <!-- Loading indicator for categories -->
    <div *ngIf="isLoadingCategories" class="px-6 py-2">
      <div class="flex items-center space-x-2 text-white text-sm">
        <div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div>
        <span>Loading categories...</span>
      </div>
    </div>
  </mat-nav-list>
