<h2 mat-dialog-title>{{ isEdit ? 'Edit Donor' : 'Create Donor' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="space-y-4">
    <!-- Donor Name (Required) -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Donor Name *</mat-label>
      <input matInput formControlName="donor" required>
      <mat-error *ngIf="form.get('donor')?.hasError('required')">Donor name is required</mat-error>
    </mat-form-field>

    <!-- Account No -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Account No</mat-label>
      <input matInput formControlName="account_no">
    </mat-form-field>

    <!-- Department Name -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Department</mat-label>
      <mat-select formControlName="department_name">
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let dept of departmentOptions" [value]="dept.value">
          {{ dept.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Finance Officer -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Finance Officer</mat-label>
      <mat-select formControlName="finance_officer_id">
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let user of users" [value]="user.id">
          {{ user.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Areas (Locations) - Multi-select -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Areas (Locations)</mat-label>
      <mat-select formControlName="location_ids" multiple>
        <mat-option *ngFor="let location of locations" [value]="location.id">
          {{ location.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- End Date -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>End Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="end_date">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <!-- Notes -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Notes</mat-label>
      <textarea matInput formControlName="notes" rows="4"></textarea>
    </mat-form-field>

    <!-- Policies -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <label class="text-sm font-medium text-gray-700">Policies</label>
        <button mat-stroked-button type="button" (click)="addPolicy()">
          <mat-icon>add</mat-icon>
          Add Policy
        </button>
      </div>

      <div *ngIf="policies.length === 0" class="text-sm text-gray-500">
        No policies added yet.
      </div>

      <div *ngFor="let policy of policies.controls; let i = index" class="flex gap-2 items-start">
        <mat-form-field appearance="outline" class="flex-1">
          <mat-label>Policy {{ i + 1 }}</mat-label>
          <textarea matInput [formControl]="$any(policy)" rows="3"></textarea>
        </mat-form-field>
        <button mat-icon-button type="button" color="warn" (click)="removePolicy(i)" matTooltip="Remove policy">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="loading || form.invalid">
    <span *ngIf="loading">Saving...</span>
    <span *ngIf="!loading">{{ isEdit ? 'Update' : 'Create' }}</span>
  </button>
</mat-dialog-actions>
