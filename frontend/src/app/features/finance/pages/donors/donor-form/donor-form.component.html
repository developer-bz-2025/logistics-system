<h2 mat-dialog-title>{{ isEdit ? 'Edit Donor' : 'Create Donor' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="space-y-4">
    <!-- Donor Name (Required) -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Donor Name *</mat-label>
      <input matInput formControlName="donor" required>
      <mat-error *ngIf="form.get('donor')?.hasError('required')">Donor name is required</mat-error>
    </mat-form-field>

    <!-- Account No -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Account No</mat-label>
      <input matInput formControlName="account_no">
    </mat-form-field>

    <!-- Department Name -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Department</mat-label>
      <mat-select formControlName="department_name">
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let dept of departmentOptions" [value]="dept.value">
          {{ dept.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Finance Officer -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Finance Officer</mat-label>
      <mat-select formControlName="finance_officer_id">
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let user of users" [value]="user.id">
          {{ user.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Areas (Locations) - Multi-select -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Areas (Locations)</mat-label>
      <mat-select formControlName="location_ids" multiple>
        <mat-option *ngFor="let location of locations" [value]="location.id">
          {{ location.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- End Date -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>End Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="end_date">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <!-- Notes -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Notes</mat-label>
      <textarea matInput formControlName="notes" rows="4"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="loading || form.invalid">
    <span *ngIf="loading">Saving...</span>
    <span *ngIf="!loading">{{ isEdit ? 'Update' : 'Create' }}</span>
  </button>
</mat-dialog-actions>
